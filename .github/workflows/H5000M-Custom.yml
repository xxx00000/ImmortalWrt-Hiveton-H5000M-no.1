# Based on the MIT-licensed WRT-CORE.yml from LianXia233/OpenWRT-CI-H5000M.
name: H5000M Stable 25.12.2
on:
  workflow_dispatch:
    inputs:
      config_only:
        description: 'Validate and export config without compiling firmware'
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_CONFIG: 'MEDIATEK-WIFI-YES'
  WRT_THEME: 'bootstrap'
  WRT_NAME: 'H5000M'
  WRT_SSID: 'H5000M'
  WRT_WORD: '12345678'
  WRT_IP: '192.168.10.1'
  WRT_PW: 'No initial root password; set one before use'
  WRT_REPO: 'https://github.com/immortalwrt/immortalwrt.git'
  WRT_BRANCH: 'v25.12.2'
  WRT_SOURCE: 'immortalwrt/immortalwrt'
  WRT_COMMIT: '4fc16f2985a358bd43bb522e43f05395fcbd6ed5'
  QMODEM_COMMIT: '5cc80e5f9fc218cd50bef9749dc7d0027e8b3072'
  FANCONTROL_COMMIT: '9bab7f720627b7e00a04d448a37542691b6c65c7'
  MT5700M_COMMIT: '93f6a65e33bab1dde645d7abe0e85e8215ae140d'
  NETMODE_COMMIT: 'c6710f8fb536c84a6e8506d4acdaae4e8c763568'
  WRT_TEST: ${{ inputs.config_only && 'true' || 'false' }}
  WRT_PACKAGE: |
    CONFIG_TARGET_MULTI_PROFILE=y
    CONFIG_TARGET_ALL_PROFILES=n
    CONFIG_TARGET_PER_DEVICE_ROOTFS=y
    CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_hiveton_h5000m=y
    CONFIG_PACKAGE_qmodem=y
    CONFIG_PACKAGE_luci-app-qmodem-next=y
    # CONFIG_PACKAGE_luci-app-qmodem is not set
    CONFIG_PACKAGE_ndisc6=y
    CONFIG_PACKAGE_quectel-CM-5G-M=y
    CONFIG_PACKAGE_kmod-mhi-bus=y
    CONFIG_PACKAGE_kmod-mhi-pci-generic=y
    CONFIG_PACKAGE_kmod-mhi-wwan-ctrl=y
    CONFIG_PACKAGE_kmod-mhi-wwan-mbim=y
    CONFIG_PACKAGE_kmod-mtk-t7xx=y
    CONFIG_PACKAGE_umbim=y
    CONFIG_PACKAGE_uqmi=y
    # CONFIG_PACKAGE_kmod-usb-net-qmi-wwan-fibocom is not set
    # CONFIG_PACKAGE_kmod-usb-net-qmi-wwan-quectel is not set

jobs:
  core:
    name: H5000M multi-modem
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt 全局超时配置：覆盖本步骤及 init_build_environment.sh 内部 apt 调用，
          # 避免偶发网络挂起导致 job 6 小时超时取消
          sudo tee /etc/apt/apt.conf.d/99marvis-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          Acquire::ftp::Timeout "60";
          DPkg::Lock::Timeout "120";
          EOF
          # apt 命令超时重试封装
          apt_retry() {
            local cmd="$1"; shift
            for i in 1 2 3; do
              timeout 300 sudo -E apt -yqq "$cmd" "$@" && return 0
              echo "apt $cmd 第 ${i} 次失败或超时，10 秒后重试" >&2
              sleep 10
            done
            return 1
          }
          apt_retry purge firefox
          apt_retry update
          apt_retry full-upgrade
          apt_retry autoremove --purge
          apt_retry autoclean
          apt_retry clean
          apt_retry install dos2unix libfuse-dev
          # 官方初始化脚本同样加超时与重试（脚本内部有 apt update 步骤）
          for i in 1 2 3; do
            timeout 600 sudo bash -c 'bash <(curl -sL --retry 3 --connect-timeout 30 https://build-scripts.immortalwrt.org/init_build_environment.sh)' && break
            echo "init_build_environment 第 ${i} 次失败或超时，10 秒后重试" >&2
            sleep 10
          done
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          test "$(git -C ./wrt rev-parse HEAD)" = "$WRT_COMMIT"

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          key: multi-modem-v2-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: multi-modem-v2-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if [ "${{ steps.check-cache.outputs.cache-hit }}" != 'true' ]; then
            CACHE_LIST=$(gh cache list --json id --key "$WRT_CONFIG-$WRT_INFO" --jq '.[].id' 2>/dev/null)
            for CACHE_ID in $CACHE_LIST; do
              gh cache delete "$CACHE_ID"
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          # video/Qt and squeezelite are not used by this firmware and contain
          # confirmed recursive Kconfig definitions in the pinned release feeds.
          sed -i '/^src-.*[[:space:]]video[[:space:]]/d' feeds.conf.default
          printf '\nsrc-git qmodem https://github.com/FUjr/QModem.git^%s\n' "$QMODEM_COMMIT" >> feeds.conf.default
          ./scripts/feeds update -a
          rm -rf feeds/packages/sound/squeezelite
          test "$(git -C feeds/qmodem rev-parse HEAD)" = "$QMODEM_COMMIT"
          grep -qx 'QMODEM_VERSION:=3.3.0' feeds/qmodem/version.mk
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          clone_commit() {
            local url="$1" dir="$2" commit="$3"
            git init "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 origin "$commit"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$commit"
          }
          clone_commit https://github.com/FAN789/luci-app-h5000m-fancontrol.git luci-app-h5000m-fancontrol "$FANCONTROL_COMMIT"
          clone_commit https://github.com/FAN789/luci-app-mt5700m.git luci-app-mt5700m "$MT5700M_COMMIT"
          clone_commit https://github.com/FAN789/luci-app-h5000m-netmode.git luci-app-h5000m-netmode "$NETMODE_COMMIT"
          # QModem is installed through its documented feed, not nested in package/.
          test -f ../feeds/qmodem/luci/luci-app-qmodem-next/Makefile
          test -f luci-app-mt5700m/mt5700m-transport/Makefile

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-mt5700m=y
          CONFIG_PACKAGE_mt5700m-transport=y
          CONFIG_PACKAGE_luci-app-h5000m-fancontrol=y
          CONFIG_PACKAGE_luci-app-h5000m-netmode=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_ndisc6=y
          CONFIG_PACKAGE_quectel-CM-5G-M=y
          CONFIG_PACKAGE_kmod-mhi-bus=y
          CONFIG_PACKAGE_kmod-mhi-pci-generic=y
          CONFIG_PACKAGE_kmod-mhi-wwan-ctrl=y
          CONFIG_PACKAGE_kmod-mhi-wwan-mbim=y
          CONFIG_PACKAGE_kmod-mtk-t7xx=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_curl=y
          EOF
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-h5000m-modem-owner <<'EOF'
          #!/bin/sh
          # Default owner is MT5700M. Enable QModem manually for other modules.
          uci -q set qmodem.main.block_auto_probe='1'
          uci -q set qmodem.main.enable_dial='0'
          uci -q set qmodem.main.enable_usb_scan='0'
          uci -q set qmodem.main.enable_pcie_scan='0'
          uci -q commit qmodem
          /etc/init.d/qmodem_init disable
          /etc/init.d/qmodem_network disable
          exit 0
          EOF
          chmod 755 files/etc/uci-defaults/99-h5000m-modem-owner
          make defconfig -j$(nproc)
          grep -E '^CONFIG_PACKAGE_(qmodem|luci-app-qmodem|quectel-CM|kmod-mhi|kmod-mtk-t7xx)|^# CONFIG_PACKAGE_(qmodem|luci-app-qmodem)' .config || true
          for symbol in TARGET_DEVICE_mediatek_filogic_DEVICE_hiveton_h5000m PACKAGE_luci-app-mt5700m PACKAGE_mt5700m-transport PACKAGE_luci-app-h5000m-fancontrol PACKAGE_luci-app-qmodem-next PACKAGE_qmodem PACKAGE_quectel-CM-5G-M PACKAGE_kmod-usb-net-rndis PACKAGE_kmod-usb-net-cdc-ncm PACKAGE_kmod-usb-net-cdc-mbim PACKAGE_kmod-usb-net-qmi-wwan PACKAGE_kmod-mhi-pci-generic PACKAGE_kmod-mhi-wwan-ctrl PACKAGE_kmod-mhi-wwan-mbim PACKAGE_kmod-mtk-t7xx; do
            grep -qx "CONFIG_${symbol}=y" .config || { echo "Required config missing: $symbol" >&2; exit 1; }
          done
          ! grep -qx 'CONFIG_PACKAGE_luci-app-qmodem=y' .config
          make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          git rev-parse HEAD > ./upload/IMMORTALWRT-COMMIT.txt
          find package -name .git -type d | while read -r metadata; do
            printf '%s %s\n' "${metadata%/.git}" "$(git -C "${metadata%/.git}" rev-parse HEAD)"
          done > ./upload/PLUGIN-COMMITS.txt
          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            for pkg in luci-app-mt5700m mt5700m-transport luci-app-h5000m-fancontrol luci-app-qmodem-next qmodem kmod-mtk-t7xx; do
              find ./bin/targets/ -name '*.manifest' -exec cat {} + | grep -q "^${pkg} - " || { echo "Required package missing: $pkg" >&2; exit 1; }
            done
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV


            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-diagnostics-${{ github.run_id }}
          include-hidden-files: true
          path: |
            wrt/.config
            wrt/tmp/.packageinfo
            wrt/tmp/.config-package.in
            wrt/feeds.conf.default
          retention-days: 7

      - name: Checksum Artifacts
        run: |
          cd wrt/upload
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-${{ github.run_id }}
          path: wrt/upload/
          retention-days: 14

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*
          body: |
            H5000M multi-modem ImmortalWrt build: MT5700M, FM350, RG501Q. Hardware validation pending.

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI 名称：${{env.WRT_SSID}}
            WIFI 密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
