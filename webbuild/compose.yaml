services:
  webbuild:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
      GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_app_key
    secrets:
      - github_app_key
    volumes:
      - tasks:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8787"
    mem_limit: 512m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webbuild
secrets:
  github_app_key:
    file: ./secrets/github-app.pem
volumes:
  tasks:
  caddy_data:
  caddy_config:
